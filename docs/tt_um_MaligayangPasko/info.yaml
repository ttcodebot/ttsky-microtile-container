
# Tiny Tapeout project information
project:
  title:        "Maligayang Pasko! (Christmas tree in a micro tile)"      # Project title
  author:       "Alexander Co Abad"      # Your name
  discord:      "alexandercoabad_25756"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "VGA pixel-art Christmas tree with a blinking star, colour-cycling lights and the greeting MALIGAYANG PASKO!, in a micro tile"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25175000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies?
  tiles: "micro"          # micro: a quarter-size experimental tile (clk, rst_n, ui_in, uo_out only)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_MaligayangPasko"
  
  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "PAUSE (freeze snow, lights and star)"
  ui[1]: "SNOW_OFF (hide the falling snow)"
  ui[2]: "SKY_BLACK (black sky instead of dark blue)"
  ui[3]: "TEXT_GREEN (green greeting instead of red)"
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "R1"
  uo[1]: "G1"
  uo[2]: "B1"
  uo[3]: "VSync"
  uo[4]: "R0"
  uo[5]: "G0"
  uo[6]: "B0"
  uo[7]: "HSync"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
